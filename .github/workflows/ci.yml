name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - run: ./scripts/check_headers.sh
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
        env:
          CGO_ENABLED: "1" # -race needs cgo; the rest of the job stays static
      - run: go run github.com/google/go-licenses@latest report ./... 2>/dev/null || true
