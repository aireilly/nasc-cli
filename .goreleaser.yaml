version: 2
builds:
  - main: ./cmd/nasc
    binary: nasc
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/aireilly/nasc-cli/internal/cli.Version={{.Version}}
archives:
  - formats: [tar.gz]
checksum:
  name_template: "checksums.txt"
