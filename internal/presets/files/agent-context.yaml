version: 1

fields:
  title:
    type: string
    required: true
    derive: h1
  type:
    type: string
    required: true
    derive: parent-dir
    enum: [concept, procedure, reference, architecture, runbook]
    # mark uses a directory's name when it is one of the values above.
    # Map other directories here; the deepest match wins and "." covers
    # top-level files. Directories left unmapped get no type, and mark
    # lists them so you can add them.
    # map:
    #   guides: procedure
    #   docs/api: reference
    #   ".": concept
    #
    # If a site generator already uses `type` (Hugo picks layouts with it),
    # store this field under another key:
    # key: nasc_type
  description:
    type: string
    required: true
    min_length: 30
    max_length: 200
    derive: llm
  tags:
    type: list
    items: string
    required: false
    derive: llm
    max_length: 8
    # List the tags this project uses to keep them consistent. validate
    # warns on others, and the llm source picks only from this list.
    # vocabulary: [api, cli, deployment, testing]
  owner:
    type: string
    required: false
    derive: codeowners
  lastUpdated:
    type: date
    required: false
    derive: git-last-change
  paths:
    # Globs for the code this doc describes, for example ["pkg/router/**"].
    # `nasc affected` uses them to flag docs that a code change touches.
    type: list
    items: string
    required: false

rules:
  - name: description-is-actionable
    when: exists(description)
    assert: length(description) >= 30
    severity: error
    message: >
      description should say, in direct active language, what a reader learns or
      can do after loading this doc. Too short to guide a human or an agent.
  - name: paths-still-resolve
    when: exists(paths)
    assert: path_match_count(paths) > 0
    severity: error
    message: No files match these globs. The code was probably moved or renamed.
  - name: doc-is-fresh
    when: exists(lastUpdated)
    assert: days_since(lastUpdated) <= 365
    severity: warn
    message: >
      The body of this doc has not changed in over a year. Check that it still
      matches the code it describes.
